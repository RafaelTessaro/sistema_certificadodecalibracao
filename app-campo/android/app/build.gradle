apply plugin: 'com.android.application'

// App BC Calibração (celular). Versão do app = versão do sistema (app-campo/package.json, igual à da raiz):
// versionName "1.1.0" → versionCode 1010000 (a·1 000 000 + b·10 000 + c·100 + build; o mesmo de `versionCode` em
// shared/campo/protocolo.ts). No CI: BC_APP_VERSAO ("1.1.0+1" numa correção só do app) e BC_APP_VERSION_CODE substituem.
def pacoteDoApp = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def versaoDoApp = System.getenv('BC_APP_VERSAO') ?: pacoteDoApp.version
def codigoDaVersao = { String v ->
    def m = (v =~ /^(\d{1,3})\.(\d{1,2})\.(\d{1,2})(?:\+(\d{1,2}))?$/)
    if (!m.matches()) throw new GradleException("Versão do app inválida: ${v} (use 1.1.0 ou 1.1.0+1)")
    return m.group(1).toInteger() * 1000000 + m.group(2).toInteger() * 10000 + m.group(3).toInteger() * 100 + (m.group(4) ?: '0').toInteger()
}
def versionCodeDoApp = System.getenv('BC_APP_VERSION_CODE') ? System.getenv('BC_APP_VERSION_CODE').toInteger() : codigoDaVersao(versaoDoApp)

// Assinatura do release pelas variáveis de ambiente (o keystore e as senhas nunca entram no repositório). Sem elas, o
// release sai sem assinatura (o CI recusa). O debug usa a chave de debug do Android.
def keystoreDoApp = System.getenv('BC_APP_KEYSTORE_FILE')

android {
    namespace = "br.com.balancas.calibracao"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.balancas.calibracao"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeDoApp
        versionName versaoDoApp
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreDoApp) {
                storeFile file(keystoreDoApp)
                storePassword System.getenv('BC_APP_KEYSTORE_SENHA')
                keyAlias System.getenv('BC_APP_CHAVE_ALIAS')
                keyPassword System.getenv('BC_APP_CHAVE_SENHA')
            }
        }
    }
    buildTypes {
        debug {
            // O emulador do CI é x86_64; os celulares são ARM
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        }
        release {
            if (keystoreDoApp) signingConfig signingConfigs.release
            // Sem minify: o R8 pode remover classes que os plugins usam por reflexão (o release com minify nunca foi
            // testado num aparelho), e 5 MB a mais não fazem diferença numa instalação direta
            minifyEnabled false
            shrinkResources false
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
